<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --primary-color: #1769d2; 
    --accent-color: #c5a977; 
    --bg-color: #f4f7fb;
    --card-bg: #ffffff;
    --text-dark: #173f70;
    --text-muted: #718096;
    --border-color: #e2e8f0;
    --today-color: #e53e3e; 
  }

  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background-color: var(--bg-color);
    margin: 0;
    padding: 0;
    color: var(--text-dark);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none; 
    -webkit-user-select: none;
    width: 100%;
    overflow-x: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
    box-shadow: 0 0 24px rgba(15,45,80,.08);
  }

  /* 헤더 영역 */
  .header {
    background-color: transparent;
    padding: 10px 12px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100%;
  }
  
  .header img {
    height: 38px; 
    width: auto;
    max-width: 55%;
    object-fit: contain;
  }
  
  .header-right {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 새글 알림 벨 아이콘 */
  .header-left {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
  }
  .notify-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #cbd5e0;
    width: 28px;
    height: 28px;
    padding: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .notify-btn svg {
    width: 18px;
    height: 18px;
    display: block;
    color: #173f70;
  }
  .notify-dot {
    display: none;
    position: absolute;
    top: 3px;
    right: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--today-color);
    border: 1.5px solid #fff;
  }

  .logout-btn {
    background-color: transparent;
    color: #718096;
    border: none;
    padding: 3px 6px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* 오늘 날짜 · 날씨 */
  .today-weather-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:calc(100% - 26px);
    margin:0 13px 8px;
    padding:7px 0 0;
  }
  .today-date-info{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .today-date{font-size:1rem;font-weight:850;color:#173f70;letter-spacing:-.03em;white-space:nowrap;}
  .today-weekday{font-size:.76rem;font-weight:750;color:#617892;white-space:nowrap;}
  .today-weather{display:flex;align-items:center;gap:6px;color:#617892;font-size:.7rem;font-weight:750;white-space:nowrap;}
  .today-weather-icon{font-size:1.05rem;line-height:1;}
  .today-weather-temp{color:#173f70;font-weight:850;}

  /* 달력 영역 */
  .calendar-wrapper {
    background: var(--card-bg);
    margin: 0 10px 14px;
    border-radius: 16px;
    padding: 12px 10px 9px;
    border: 1.5px solid #e2eaf4;
    box-shadow: 0 5px 18px rgba(0,82,204,0.04);
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 800;
    font-size: 1.06rem;
    position: relative;
    padding: 0 68px;
    min-height: 32px;
  }
  .cal-header > #calMonthDisplay{
    position: relative;
    text-align: center;
    width: 100%;
    color: #173f70;
  }
  .cal-header > .cal-nav-btn:first-child{
    position: absolute;
    left: 3px;
    top: 50%;
    transform: translateY(-50%);
  }
  .cal-header-right {
    position: absolute;
    right: 3px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .cal-nav-btn, .calendar-refresh-btn {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    font-size: 1.12rem;
    color: #1769d2;
    cursor: pointer;
    padding: 0;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    text-align: center;
  }
  .cal-day-name {
    font-size: 0.65rem;
    color: var(--text-muted);
    padding-bottom: 3px;
    font-weight: 700;
  }
  .cal-cell {
    min-height: 44px;
    border-radius: 9px;
    background: #fdfdfd;
    border: 1px solid #f0f0f0;
    display: flex;
    flex-direction: column;
    padding: 4px 3px;
    text-align: left;
    position: relative;
  }
  .cal-cell.empty { background: transparent; border: none; }
  .cal-cell.today { background: #fff5f5; border: 1.5px solid var(--today-color); }
  
  .cal-date-num {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 2px;
  }
  .text-red { color: #e53e3e !important; }
  .text-blue { color: #3182ce !important; }
  .today-badge {
    background-color: var(--today-color);
    color: #ffffff;
    font-size: 0.45rem;
    padding: 1px 2px;
    border-radius: 2px;
    margin-left: 2px;
    font-weight: 800;
  }
  .cal-event-chip {
    font-size: 0.55rem;
    padding: 2px;
    border-radius: 3px;
    margin-bottom: 2px;
    color: #000;
    background-color: #fff;
    border: 1px solid #e5e7eb;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event-chip.chairman { background-color: #d0e1fd; border-color: #d0e1fd; }

  /* 일정 배너 */
  .schedule-banner {
    position: relative;
    width: calc(100% - 20px);
    margin: 0 10px 10px;
    height: 84px;
    border-radius: 14px;
    overflow: hidden;
    color: #fff;
    background: linear-gradient(135deg, #073b8f 0%, #0756c9 52%, #0878d9 100%);
    box-shadow: 0 10px 26px rgba(0,61,145,.20);
  }
  .schedule-banner-track, .schedule-banner-slide { height: 84px; }
  .schedule-banner-slide {
    display: none;
    padding: 8px 12px 12px;
    box-sizing: border-box;
  }
  .schedule-banner-slide.active { display: flex; flex-direction: column; justify-content: center; }
  
  .banner-heading { display: flex; align-items: center; gap: 6px; margin-bottom: 1px; min-height: 20px; }
  .banner-kicker { padding: 0 7px; border-radius: 999px; background: rgba(255,255,255,.16); font-size: .56rem; font-weight: 800; }
  .banner-meta { font-size: .69rem; font-weight: 650; color: rgba(255,255,255,.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .banner-event { background: transparent; border: 0; color: #fff; text-align: left; padding: 0; }
  .banner-event-line2 { font-size: .94rem; font-weight: 800; margin-top: 0; line-height: 1.25; }
  
  .banner-dots { position: absolute; right: 34px; bottom: 8px; display: flex; gap: 5px; }
  .banner-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.42); border: 0; }
  .banner-dot.active { width: 8px; height: 8px; background: #fff; }
  
  .banner-pause-btn {
    position: absolute; right: 18px; bottom: 5.5px;
    width: 14px; height: 14px; border: 0; background: transparent;
    color: rgba(255,255,255,.7); font-size: .65rem;
  }

  /* 상단 메뉴바 */
  .quick-menu-container, .sub-menu-container {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0 8px 9px;
  }
  .quick-btn {
    display: flex; flex-direction: column; align-items: center;
    background: transparent; border: 0; cursor: pointer; text-decoration: none;
  }
  .quick-icon {
    width: 50px; height: 50px; border-radius: 14px; background: #fff;
    border: 1px solid #e6edf7; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 14px rgba(22,52,95,.08);
  }
  .quick-icon img { width: 72%; height: 72%; object-fit: contain; }
  .quick-icon svg { width: 31px; height: 31px; }
  .quick-label { margin-top: 6px; font-size: .66rem; font-weight: 750; color: var(--text-dark); }
  
  /* 활성화된 관심일정 버튼 배경 변경 */
  .active-bookmark .quick-icon { background-color: #e6f2ff; border-color: #cce0ff; }

  /* 일정 리스트 영역 */
  .schedule-container { padding: 5px 10px 30px; display: flex; flex-direction: column; gap: 0; }
  .schedule-container::before { content: ''; display: block; width: 94%; height: 0.5px; margin: 0 auto 15px; background: linear-gradient(90deg, transparent, #a0aec0, transparent); }
  .schedule-section-header { display: flex; justify-content: space-between; align-items: flex-end; padding: 5px 5px 0; margin-bottom: 2px; }
  .schedule-section-title { font-size: 1.15rem; font-weight: 800; color: var(--text-dark); }
  .schedule-section-subtitle { font-size: 0.85rem; color: #a0aec0; font-weight: 500; line-height: 1.1; }
  
  .schedule-list-wrapper { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  #scheduleContainer > .schedule-list-wrapper:last-child { margin-top: 4px; }

  /* 이벤트 카드 */
  .event-card {
    background: var(--card-bg); border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.04);
    position: relative; padding: 0;
  }
  .event-card.today-card { border: 2.5px solid #e53e3e; }
  .card-today-badge {
    position: absolute; bottom: 0; right: 0;
    background-color: #e53e3e; color: #fff;
    font-size: 0.5rem; font-weight: 800; padding: 2px 5px;
    border-radius: 6px 0 10px 0; z-index: 5;
  }
  
  .event-header {
    display: flex; flex-direction: column; text-align: left;
    padding: 8px 54px 8px 10px; background: transparent; border: 0; width: 100%; cursor: pointer;
  }
  .event-meta { display: flex; gap: 4px; margin-bottom: 3px; align-items: center; }
  .event-date { font-size: .82rem; font-weight: 800; color: #000; }
  .event-divider { font-size: .78rem; color: #cbd5e0; font-weight: 700; }
  .event-location { font-size: .72rem; color: var(--text-muted); font-weight: 600; }
  .event-title { font-size: .9rem; font-weight: 600; color: var(--text-dark); line-height: 1.28; }
  .event-title.chairman { color: var(--primary-color); font-weight: 800; }
  
  .card-actions { position: absolute; top: 7px; right: 6px; display: flex; gap: 2px; z-index: 5; }
  .icon-btn { width: 27px; height: 27px; background: none; border: 0; color: #cbd5e0; display: flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 18px; height: 18px; }
  .star-btn.starred { color: #d69e2e; }

  /* 팝업(모달) 스타일 */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.55); z-index: 2000;
    align-items: center; justify-content: center; padding: 12px;
  }
  .modal-content {
    background: #ffffff; width: 100%; max-width: 400px; border-radius: 14px;
    padding: 18px; position: relative; max-height: 90vh; overflow-y: auto;
  }
  .modal-close { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.5rem; color: #a0aec0; }
  
  /* 임직원현황 화면 */
  #staffScreen {
    display: none; flex-direction: column; position: fixed; inset: 0; z-index: 1500;
    background: #f4f7fb; align-items: center; width: 100vw; padding: 0 0 18px;
  }
  #staffScreen .staff-mobile-header,
  #staffScreen #staffTabs,
  #staffScreen #memberViewTabs,
  #staffScreen .fullscreen-content {
    width: calc(100% - 14px); max-width: 430px; margin: 0 auto;
  }
  
  #staffScreen .staff-mobile-header {
    height: 54px; flex: 0 0 54px; display: flex; align-items: center; position: relative;
    background: #fff; border-bottom: 1px solid #edf2f7; box-shadow: 0 3px 14px rgba(25,67,110,.055);
    border-radius: 0 0 14px 14px; margin-bottom: 10px;
  }
  #staffScreen .fullscreen-back-btn {
    position: relative; z-index: 3; width: 42px; height: 42px; border: 0; background: #f1f6fd; color: #1769d2;
    border-radius: 14px; font-size: 1.4rem; margin-left: 10px;
  }
  #staffScreen .fullscreen-title {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 1.12rem; font-weight: 850; color: #173f70; margin: 0; z-index: 2;
  }
  
  .fullscreen-tabs, .staff-view-tabs {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; height: 50px; flex: 0 0 50px;
  }
  .staff-view-tabs { grid-template-columns: repeat(4, 1fr); margin-bottom: 10px; height: 40px; flex: 0 0 40px; }
  
  .month-tab, .staff-view-btn {
    background: #fff; border: 1px solid #dce6f2; border-radius: 10px; color: #5d7089;
    font-size: 0.8rem; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .month-tab.active, .staff-view-btn.active {
    background: #1769d2; color: #fff; border-color: #1769d2;
  }

  .fullscreen-content { flex: 1 1 auto; overflow-y: auto; padding-bottom: 25px; }
  
  .staff-search-wrap { position: relative; margin-bottom: 10px; }
  .staff-search {
    width: 100%; height: 46px; border: 1px solid #dce6f2; border-radius: 14px;
    padding: 0 42px; font-size: .86rem; font-weight: 650; box-shadow: 0 3px 11px rgba(24,71,120,.045);
  }
  .staff-search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #1769d2; }

  /* 임직원현황 리스트 카드 */
  #staffList { display: flex; flex-direction: column; gap: 0; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #e2eaf4;}
  #staffList.dept-mode { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; background: transparent; border: none;}
  
  .staff-person-row {
    display: flex; align-items: center; padding: 12px 15px; border: none; border-bottom: 1px solid #edf2f7;
    background: #fff; cursor: pointer; text-align: left; gap: 12px;
  }
  .staff-person-row:last-child { border-bottom: none; }
  
  .staff-person-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: #eaf3ff; color: #4b8fdf;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
  }
  .staff-person-avatar.executive { background: #edf7ff; color: #2e82d6; }
  .staff-person-avatar svg { width: 28px; height: 28px; fill: currentColor; }
  
  .staff-person-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .staff-person-info strong { font-size: 1rem; color: #173f70; font-weight: 800; }
  .staff-person-info span { font-size: 0.8rem; color: #7187a1; font-weight: 600; }
  
  .staff-person-chevron { color: #cbd5e0; font-size: 1.2rem; }

  .staff-koda-badge {
    background: #eaf3ff; color: #1769d2; padding: 2px 8px; border-radius: 12px; font-size: 0.65rem; font-weight: 800; margin-right: 6px;
  }

  /* 부서별 그리드 카드 */
  .staff-team-button {
    background: #fff; border: 1px solid #e2eaf4; border-radius: 14px; padding: 15px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 12px rgba(28,70,120,.055);
  }
  .staff-team-icon {
    font-size: 1.8rem; color: #1769d2;
  }
  .staff-team-button-name { font-size: 0.9rem; font-weight: 800; color: #173f70; }
  .staff-team-button-leader { font-size: 0.75rem; color: #718096; }

  /* 컴퓨터 파일 트리 형식의 조직도 CSS */
  #staffOrgView { padding: 15px 5px; }
  .tree-container {
    display: flex; flex-direction: column; align-items: flex-start;
  }
  .tree-node {
    background: #1769d2; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-weight: 800; font-size: 0.95rem; margin-bottom: 20px; text-align: center; width: 180px; align-self: center;
  }
  .tree-node.sub-node {
    background: #4a90e2; margin-bottom: 0; position: relative;
  }
  .tree-branch-container {
    display: flex; flex-direction: column; position: relative; margin-left: 50%;
    border-left: 2px solid #b8cde0; padding-left: 20px; padding-bottom: 20px; margin-top: -10px; padding-top: 30px;
  }
  .tree-leaf {
    background: #fff; border: 1px solid #dce6f2; border-radius: 8px; padding: 10px 15px;
    margin-bottom: 10px; width: 160px; box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    position: relative; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .tree-leaf::before {
    content: ''; position: absolute; left: -22px; top: 50%; width: 20px; height: 2px; background: #b8cde0;
  }
  .tree-leaf-title { font-weight: 800; color: #173f70; font-size: 0.85rem;}
  .tree-leaf-desc { font-size: 0.7rem; color: #7187a1; }
  .tree-leaf-arrow { color: #1769d2; font-weight: bold; }

  /* 직원 상세 모달 */
  .staff-profile-head {
    display: flex; flex-direction: column; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #edf2f7; margin-bottom: 15px;
  }
  .staff-profile-avatar-large {
    width: 70px; height: 70px; border-radius: 50%; background: #eaf3ff; color: #4b8fdf;
    display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 10px;
  }
  .staff-profile-name-large { font-size: 1.25rem; font-weight: 800; color: #173f70; margin-bottom: 5px; }
  .staff-profile-role-large { font-size: 0.85rem; color: #7187a1; font-weight: 600; }
  
  .staff-contact-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.85rem; color: #173f70;
  }
  .staff-contact-icon { color: #7187a1; }
  
  .staff-note-box {
    background: #f8fafc; border-radius: 8px; padding: 12px; font-size: 0.8rem; color: #718096; margin: 15px 0;
  }

  .action-btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .action-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border-radius: 8px; font-weight: 800; text-decoration: none; font-size: 0.9rem;
  }
  .btn-call { background-color: #1769d2; color: #fff; }
  .btn-sms { background-color: #fff; color: #1769d2; border: 1px solid #1769d2; }
  .btn-email { background-color: #fff; color: #718096; border: 1px solid #cbd5e0; }

</style>
</head>
<body>

<div class="login-screen" id="loginScreen" style="display:none; position:fixed; inset:0; background:#f4f7fb; z-index:3000; align-items:center; justify-content:center; padding:20px;">
  <!-- 로그인 화면 생략 (기존과 동일하게 유지) -->
</div>

<div class="app-container" id="appRoot">
  <div class="header">
    <div class="header-left">
      <button type="button" class="notify-btn" onclick="openNewsScreen()">

<script>
  // 기본 시트 정보
  const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEbM8YAc7jQes9oX6_-aVsVib2H40avHQkL6TkRRI2cYmw7nYG29F_1lGGz-2gL0nve4Q91MBM02Q-/pub?output=csv";
  const STAFF_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEbM8YAc7jQes9oX6_-aVsVib2H40avHQkL6TkRRI2cYmw7nYG29F_1lGGz-2gL0nve4Q91MBM02Q-/pub?gid=2094790194&single=true&output=csv";
  const MEMBER_COMPANY_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEbM8YAc7jQes9oX6_-aVsVib2H40avHQkL6TkRRI2cYmw7nYG29F_1lGGz-2gL0nve4Q91MBM02Q-/pub?gid=320441592&single=true&output=csv";

  let staffData = [];
  let memberCompanyData = [];
  let currentStaffCategory = '전체';
  
  // CSV 공통 파서
  function splitCSV(csv) {
    const rows = [];
    let row = [], curr = '';
    let insideQuote = false;
    for (let i = 0; i < csv.length; i++) {
      const char = csv[i], nextChar = csv[i + 1];
      if (char === '"' && insideQuote && nextChar === '"') { curr += '"'; i++; }
      else if (char === '"') { insideQuote = !insideQuote; }
      else if (char === ',' && !insideQuote) { row.push(curr); curr = ''; }
      else if ((char === '\n' || char === '\r') && !insideQuote) {
        if (char === '\r' && nextChar === '\n') i++;
        row.push(curr); rows.push(row); row = []; curr = '';
      } else { curr += char; }
    }
    if (curr || row.length > 0) { row.push(curr); rows.push(row); }
    return rows;
  }

  // --- 시트 7 회원사 데이터 파싱 ---
  function parseMemberCompanyCSV(csv) {
    const rows = splitCSV(csv);
    const data = [];
    for(let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if(!r[1]) continue; // 회사명이 없으면 패스
        data.push({
            name: r[1] ? r[1].trim() : "",        // B열: 회사명
            type: r[2] ? r[2].trim() : "",        // C열: 정회원/준회원
            rep: r[3] ? r[3].trim() : "",         // D열: 대표자
            region: r[5] ? r[5].trim() : "기타",   // F열: 지역 (17개 시도)
            joinDate: r[10] ? r[10].trim() : "",  // K열: 가입일자
            phone: r[4] ? r[4].trim() : "",       // E열: 연락처 임의할당
            category: '회원사'
        });
    }
    return data;
  }

  async function loadMemberCompanyData() {
    try {
        const response = await fetch(MEMBER_COMPANY_SHEET_CSV_URL + "&t=" + new Date().getTime());
        memberCompanyData = parseMemberCompanyCSV(await response.text());
    } catch(e) { console.error("회원사 데이터 로드 실패", e); }
  }

  // --- 기존 임직원 데이터 파싱 ---
  function parseStaffCSV(csv) {
    const rows = splitCSV(csv);
    const dataArr = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.length < 3 || !r[2]) continue; 
      dataArr.push({
        category: r[0] ? r[0].trim() : "분류없음",
        name: r[2] ? r[2].trim() : "",
        affiliation: r[3] ? r[3].trim() : "",
        position: r[4] ? r[4].trim() : "",
        team: r[5] ? r[5].trim() : "",
        koda: r[6] ? r[6].trim() : "",
        phone: r[7] ? r[7].trim() : "",
        email: r[8] ? r[8].trim() : "",
        note: r[9] ? r[9].trim() : ""
      });
    }
    return dataArr;
  }

  async function loadStaffData() {
    try {
      const response = await fetch(STAFF_SHEET_CSV_URL + "&t=" + new Date().getTime());
      staffData = parseStaffCSV(await response.text());
      await loadMemberCompanyData(); // 시트7 데이터도 함께 로드
      filterStaff('전체');
    } catch (error) {
      document.getElementById('staffList').innerHTML = `<div style="padding:20px; text-align:center;">데이터를 불러오지 못했습니다.</div>`;
    }
  }

  // 탭 전환 및 필터링 로직
  window.filterStaff = function(category) {
    currentStaffCategory = category;
    
    // 탭 UI 활성화 처리
    document.querySelectorAll('#staffTabs .month-tab').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.trim() === category);
    });

    const staffViewTabs = document.getElementById('staffViewTabs');
    const memberViewTabs = document.getElementById('memberViewTabs');
    const orgView = document.getElementById('staffOrgView');
    const list = document.getElementById('staffList');
    
    orgView.style.display = 'none';
    list.style.display = 'flex';
    list.classList.remove('dept-mode');
    
    if (category === '사무국') {
      staffViewTabs.style.display = 'grid';
      memberViewTabs.style.display = 'none';
      changeStaffView('org');
    } else if (category === '회원사') {
      staffViewTabs.style.display = 'none';
      memberViewTabs.style.display = 'grid';
      changeMemberView('all');
    } else {
      staffViewTabs.style.display = 'none';
      memberViewTabs.style.display = 'none';
      renderStandardList(staffData.filter(d => d.category === category || category === '전체'), category);
    }
  }

  // 회원사 전용 뷰 렌더링
  window.changeMemberView = function(filterType) {
    document.querySelectorAll('#memberViewTabs .staff-view-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${filterType}'`));
    });

    const list = document.getElementById('staffList');
    list.innerHTML = '';
    
    let renderData = [...memberCompanyData];
    
    if(filterType === '정회원' || filterType === '준회원') {
        renderData = renderData.filter(d => d.type.includes(filterType));
    } else if (filterType === 'region') {
        renderData.sort((a,b) => a.region.localeCompare(b.region));
    } else if (filterType === 'date') {
        renderData.sort((a,b) => new Date(b.joinDate || 0) - new Date(a.joinDate || 0));
    }
    
    renderData.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = 'staff-person-row';
        btn.innerHTML = `
          <span class="staff-person-avatar"><svg viewBox="0 0 52 52"><circle cx="26" cy="17" r="8"/><path d="M12 43c1.5-8.8 6.3-13.5 14-13.5S38.5 34.2 40 43"/></svg></span>
          <span class="staff-person-info">
            <strong>${item.name}</strong>
            <span>${item.type} ${item.region ? `| ${item.region}` : ''}</span>
          </span>
          <span class="staff-person-chevron">›</span>
        `;
        // 클릭 시 모달 연동 (필요에 따라 데이터 매핑)
        btn.onclick = () => showMemberDetail(item);
        list.appendChild(btn);
    });
  }

  function showMemberDetail(item) {
      document.getElementById('staffDetailName').innerText = item.name;
      document.getElementById('staffDetailRole').innerText = `${item.rep} 대표 | ${item.type}`;
      document.getElementById('staffDetailPhone').innerText = item.phone || '-';
      document.getElementById('staffDetailEmail').innerText = '-';
      document.getElementById('staffDetailNote').innerText = `가입일자: ${item.joinDate}\n지역: ${item.region}`;
      document.getElementById('staffDetailModal').style.display = 'flex';
  }

  // 일반 리스트 렌더링 (가운데 점 제거 및 7대 임원 뱃지 처리)
  function renderStandardList(data, category) {
    const list = document.getElementById('staffList');
    list.innerHTML = '';
    data.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'staff-person-row';
        
        // 7대 임원 뱃지 처리 (김한모 회장 등)
        let badgeHtml = '';
        if (category === '7대 임원' && item.koda === '협회장') {
            badgeHtml = `<span class="staff-koda-badge">협회장</span>`;
        }

        // 띄어쓰기로 부서/직책 구분 (가운데 점 제거)
        const role = [item.affiliation, item.position].filter(Boolean).join(' ');

        btn.innerHTML = `
          <span class="staff-person-avatar"><svg viewBox="0 0 52 52"><circle cx="26" cy="17" r="8"/><path d="M12 43c1.5-8.8 6.3-13.5 14-13.5S38.5 34.2 40 43"/></svg></span>
          <span class="staff-person-info">
            <strong style="display:flex; align-items:center;">${badgeHtml} ${item.name}</strong>
            <span>${role}</span>
          </span>
          <span class="staff-person-chevron">›</span>
        `;
        btn.onclick = () => openStaffDetailModal(item);
        list.appendChild(btn);
    });
  }

  // 사무국 서브 뷰 처리 (조직도 포함)
  window.changeStaffView = function(view) {
    document.querySelectorAll('#staffViewTabs .staff-view-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${view}'`));
    });

    const orgView = document.getElementById('staffOrgView');
    const list = document.getElementById('staffList');

    if (view === 'org') {
        orgView.style.display = 'block';
        list.style.display = 'none';
        renderFileTreeOrgChart();
    } else if (view === 'dept') {
        orgView.style.display = 'none';
        list.style.display = 'grid';
        list.classList.add('dept-mode');
        renderDepartmentCards();
    } else {
        orgView.style.display = 'none';
        list.style.display = 'flex';
        list.classList.remove('dept-mode');
        // 이름순, 직책순 정렬 로직 (생략 - 기존 로직 유지)
        renderStandardList(staffData.filter(d => d.category === '사무국'), '사무국');
    }
  }

            <div class="tree-branch-container" style="margin-left: 100px;">
                <div class="tree-leaf">
                    <div>
                        <div class="tree-leaf-title">기획홍보팀</div>

                    <div class="tree-leaf-arrow">›</div>
                </div>
                <div class="tree-leaf">
                    <div>
                        <div class="tree-leaf-title">회원지원팀</div>
                        <div class="tree-leaf-desc">장예슬 팀장 (4명)</div>
                    </div>
                    <div class="tree-leaf-arrow">›</div>
                </div>
                <div class="tree-leaf">
                    <div>
                        <div class="tree-leaf-title">법정업무(위탁)팀</div>
                        <div class="tree-leaf-desc">김지영 팀장 (3명)</div>
                    </div>
                    <div class="tree-leaf-arrow">›</div>
                </div>
                <div class="tree-leaf">

                        <div class="tree-leaf-title">법정업무(교육)팀</div>

                    </div>
                    <div class="tree-leaf-arrow">›</div>
                </div>
            </div>
            
            <div style="font-size:0.7rem; color:#a0aec0; margin-top: 15px; text-align:center; width:100%;">※ 팀을 선택하시면 해당 팀의 직원 목록을 확인할 수 있습니다.</div>
        </div>
      `;
  }

  // 부서별 카드 뷰 (스크린샷 참조)
  function renderDepartmentCards() {
      const list = document.getElementById('staffList');
      list.innerHTML = '';
      const depts = [
          { name: '기획홍보팀', icon: '📢', count: 4 },
          { name: '경영지원팀', icon: '⚙️', count: 3 },
          { name: '회원지원팀', icon: '👥', count: 4 },
          { name: '법정업무(위탁)팀', icon: '📄', count: 3 },
          { name: '법정업무(교육)팀', icon: '🎓', count: 3 },
          { name: '정책팀', icon: '📈', count: 3 }
      ];

      depts.forEach(dept => {
          const btn = document.createElement('button');
          btn.className = 'staff-team-button';
          btn.innerHTML = `
              <div class="staff-team-icon">${dept.icon}</div>
              <div>
                  <div class="staff-team-button-name">${dept.name}</div>
                  <div class="staff-team-button-leader">${dept.count}명</div>
              </div>
          `;
          list.appendChild(btn);
      });
  }

  // 상세 모달 열기
  window.openStaffDetailModal = function(item) {
      document.getElementById('staffDetailName').innerText = item.name;
      document.getElementById('staffDetailRole').innerText = `${item.position || ''} | ${item.team || item.affiliation || ''}`;
      document.getElementById('staffDetailPhone').innerText = item.phone || '-';
      document.getElementById('staffDetailEmail').innerText = item.email || '-';
      document.getElementById('staffDetailNote').innerText = item.note || '(추가 정보가 있을 경우 표시됩니다.)';
      
      const normPhone = (item.phone || '').replace(/[^0-9]/g, '');
      const callBtn = document.getElementById('staffBtnCall');
      const smsBtn = document.getElementById('staffBtnSms');
      if(normPhone) {
          callBtn.href = `tel:${normPhone}`;
          smsBtn.href = `sms:${normPhone}`;
      }
      
      document.getElementById('staffDetailModal').style.display = 'flex';
  }

  window.closeStaffDetailModal = function() {
      document.getElementById('staffDetailModal').style.display = 'none';
  }
  
  window.closeStaffDetailModalOnOutsideClick = function(e) {
      if(e.target.id === 'staffDetailModal') closeStaffDetailModal();
  }

  // 창 열기/닫기
  window.openStaffScreen = function() {
      document.getElementById('staffScreen').style.display = 'flex';
      if(staffData.length === 0) loadStaffData();
  }
  window.closeStaffScreen = function() {
      document.getElementById('staffScreen').style.display = 'none';
  }

</script>

</body>
