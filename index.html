<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한국디벨로퍼협회(KODA) 일정 안내</title>

<meta property="og:type" content="website">

<meta property="og:url" content="https://kodanew.github.io/koda-planning/">
<meta property="og:image" content="https://kodanew.github.io/koda-planning/share-image.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KODA 일정">
<link rel="apple-touch-icon" href="로고.png">
<link rel="manifest" href="manifest.json">

<!-- 카카오톡 인앱 브라우저 강제 탈출 스크립트 -->
<script>
  var userAgent = navigator.userAgent.toLowerCase();
  if(userAgent.indexOf('kakaotalk') > -1){
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  }
</script>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --primary-color: #0052cc; 
    --accent-color: #c5a977; 
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --text-dark: #1a202c;
    --text-muted: #718096;
    --border-color: #e2e8f0;
    --today-color: #e53e3e; 
  }

  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background-color: var(--bg-color);
    margin: 0;
    padding: 0;
    color: var(--text-dark);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none; 
    -webkit-user-select: none;
    width: 100%;
    overflow-x: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    background: var(--bg-color);
  }

  /* 헤더 영역 */
  .header {
    background-color: transparent;
    padding: 10px 12px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100%;
  }
  .header img {
    height: 26px; 
    width: auto;
    max-width: 55%;
    object-fit: contain;
  }
  
  .refresh-btn {
    position: absolute;
    left: 20px;
    top: 15px;
    background-color: transparent;
    color: #718096;
    border: 1px solid #e2e8f0;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh-btn:active {
    color: #1a202c;
  }

  .header-right {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .install-btn {
    top: 25px;
    background-color: transparent;
    color: #718096;
    border: 1px solid #e2e8f0;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }

  .logout-btn {
    top: 25px;
    background-color: transparent;
    color: #718096;
    border: 1px solid #e2e8f0;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 0.6rem;
    font-weight: 600;
    cursor: pointer;
  }
  .logout-btn:active {
    color: #1a202c;
  }

  /* 오늘 날짜 · 날씨 */
  .today-weather-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:calc(100% - 20px);
    margin:0 10px 4px;
    padding:2px 3px 0;
  }
  .today-date-info{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .today-date{font-size:1.05rem;font-weight:800;color:#123b70;letter-spacing:-.03em;white-space:nowrap;}
  .today-weekday{font-size:.84rem;font-weight:700;color:#4f6f95;white-space:nowrap;}
  .today-weather{display:flex;align-items:center;gap:6px;color:#4f6f95;font-size:.78rem;font-weight:700;white-space:nowrap;}
  .today-weather-icon{font-size:1.05rem;line-height:1;}
  .today-weather-temp{color:#123b70;font-weight:800;}
  @media(max-width:360px){.today-weather-bar{gap:7px}.today-date{font-size:.98rem}.today-weekday,.today-weather{font-size:.72rem}}

  /* 달력 영역 */
  .calendar-wrapper {
    background: var(--card-bg);
    margin: 10px;
    border-radius: 12px;
    padding: 10px;
    border: 1.5px solid #2b73d2;
    box-shadow: 0 5px 18px rgba(0,82,204,0.08);
    overflow: hidden; 
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 700;
    font-size: 1rem;
  }
  .cal-nav-btn {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef5ff;
    border: 1px solid #c9ddfb;
    border-radius: 9px;
    font-size: 1.15rem;
    line-height: 1;
    font-weight: 800;
    color: #0756c9;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 3px 8px rgba(0,82,204,.10);
  }
  .cal-nav-btn:active { transform: scale(.95); background:#dcecff; }
  
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0.3; transform: translateX(5px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .cal-day-name {
    font-size: 0.65rem;
    color: var(--text-muted);
    padding-bottom: 3px;
    font-weight: 600;
  }
  .cal-cell {
    min-height: 48px;
    border-radius: 4px;
    background: #fdfdfd;
    border: 1px solid #f0f0f0;
    display: flex;
    flex-direction: column;
    padding: 2px;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .cal-cell.empty { background: transparent; border: none; }
  
  .cal-cell.today {
    background: #fff5f5; 
    border: 1.5px solid var(--today-color); 
  }
  
  .cal-date-num {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 2px;
    padding-left: 1px;
    display: flex;
    align-items: center;
  }
  
  .text-red { color: #e53e3e !important; }
  .text-blue { color: #3182ce !important; }

  .today-badge {
    background-color: var(--today-color);
    color: #ffffff;
    font-size: 0.45rem;
    padding: 1px 2px;
    border-radius: 2px;
    margin-left: 2px;
    font-weight: 800;
    line-height: 1;
  }
  
  .cal-event-chip {
    font-size: 0.55rem;
    padding: 2px 2px;
    border-radius: 3px;
    margin-bottom: 2px;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    font-weight: 600;
    cursor: pointer;
  }
  .cal-event-chip.chairman {
    background-color: #d0e1fd;
    border: 1px solid #d0e1fd;
    color: #000000;
  }

  /* ✨ 모던 일정 배너 ✨ */
  .schedule-banner {
    margin-top:0!important;
    position: relative;
    width: calc(100% - 20px);
    margin: 0 10px 10px;
    min-height: 112px;
    border-radius: 20px;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(circle at 92% 15%, rgba(110,190,255,.28) 0, rgba(110,190,255,0) 34%),
      radial-gradient(circle at 10% 100%, rgba(38,111,255,.30) 0, rgba(38,111,255,0) 35%),
      linear-gradient(135deg, #073b8f 0%, #0756c9 52%, #0878d9 100%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 10px 26px rgba(0,61,145,.20);
    touch-action: pan-y;
  }
  .schedule-banner::before,
  .schedule-banner::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,.10);
  }
  .schedule-banner::before { width: 110px; height: 110px; right: -35px; top: -55px; }
  .schedule-banner::after { width: 72px; height: 72px; left: -34px; bottom: -42px; }
  .schedule-banner-track { position: relative; min-height: 112px; z-index: 1; }
  .schedule-banner-slide {
    display: none;
    min-height: 112px;
    padding: 15px 18px 25px;
    box-sizing: border-box;
    animation: bannerFade .28s ease;
  }
  .schedule-banner-slide.active { display: flex; flex-direction: column; justify-content: center; }
  @keyframes bannerFade {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .banner-heading {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
  }
  .banner-kicker {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 0 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.18);
    color: rgba(255,255,255,.92);
    font-size: .60rem;
    font-weight: 800;
    letter-spacing: -.01em;
  }
  .banner-title { display:none; }
  .banner-list { display:flex; flex-direction:column; gap:0; width:100%; }
  .banner-event {
    width:100%;
    padding:0;
    border:0;
    background:transparent;
    color:#fff;
    text-align:left;
    cursor:pointer;
  }
  .banner-event-line1 {
    display:block;
    width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:rgba(255,255,255,.84);
    font-size:.80rem;
    line-height:1.35;
    font-weight:650;
    letter-spacing:-.025em;
  }
  .banner-event-line2 {
    display:block;
    width:100%;
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#fff;
    font-size:1.08rem;
    line-height:1.35;
    font-weight:800;
    letter-spacing:-.035em;
  }
  .banner-empty { padding:18px 8px; font-size:.78rem; color:rgba(255,255,255,.78); text-align:center; }
  .banner-nav { display:none !important; }
  .banner-dots {
    position:absolute;
    right:42px;
    bottom:9px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    z-index:3;
  }
  .banner-dot {
    width:6px;
    height:6px;
    padding:0;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.42);
    cursor:pointer;
  }
  .banner-dot.active { width:7px; height:7px; background:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.16); }
  .banner-pause-btn {
    position:absolute;
    right:11px;
    bottom:6px;
    width:24px;
    height:24px;
    padding:0;
    border:1px solid rgba(255,255,255,.28);
    border-radius:8px;
    background:rgba(255,255,255,.13);
    color:#fff;
    font-size:.65rem;
    line-height:22px;
    font-weight:900;
    z-index:4;
    cursor:pointer;
    backdrop-filter:blur(6px);
  }
  .banner-pause-btn.paused { background:#fff; color:#0756c9; }

  /* 상단 메뉴바 */
  .quick-menu-container,
  .sub-menu-container {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
    padding:0 8px 9px;
    width:100%;
    box-sizing:border-box;
    align-items:start;
  }
  .quick-btn {
    min-height:78px;
    padding:0;
    background:transparent !important;
    border:0;
    color:var(--text-dark);
    text-align:center;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    box-shadow:none;
    word-break:keep-all;
    cursor:pointer;
    box-sizing:border-box;
  }
  .quick-icon {
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:1px solid #e6edf7;
    box-shadow:0 5px 14px rgba(22,52,95,.08);
    overflow:hidden;
    transition:transform .15s, box-shadow .15s;
  }
  .quick-icon img { width:72%; height:72%; object-fit:contain; display:block; }
  .quick-icon svg { width:31px; height:31px; display:block; }
  .quick-btn:hover .quick-icon { transform:translateY(-2px); box-shadow:0 8px 18px rgba(22,52,95,.12); }
  .quick-label {
    margin-top:6px;
    font-size:.66rem;
    font-weight:750;
    line-height:1.15;
    white-space:normal;
  }
  .sub-menu-container { padding-top:1px; padding-bottom:10px; }
  .sub-menu-container .quick-btn { min-height:78px; }

  /* 일정 리스트 영역 */
  .schedule-container {
    padding: 0 10px 30px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .schedule-section-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 5px 10px 5px;
    margin-top: 5px;
    margin-bottom: 0px;
    width: 100%;
    row-gap: 4px;
  }
  
  .schedule-title-wrapper {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: clamp(4px, 2vw, 8px);
    margin-left: clamp(4px, 3vw, 12px);
    min-width: 0;
  }

  .schedule-section-title {
    font-size: clamp(0.95rem, 4.2vw, 1.15rem);
    font-weight: 800;
    color: var(--text-dark);
    white-space: nowrap;
  }

  .schedule-section-subtitle {
    font-size: clamp(0.68rem, 3vw, 0.85rem); 
    color: #a0aec0; 
    font-weight: 500;
  }

  .past-schedule-btn {
    background: none;
    border: none;
    font-size: clamp(0.62rem, 2.8vw, 0.75rem);
    color: var(--text-muted);
    text-decoration: none; 
    cursor: pointer;
    padding: 0 2px 2px 0;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .past-schedule-btn:hover {
    color: var(--text-dark);
  }

  .schedule-list-wrapper {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  #pastScheduleList {
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px dashed var(--border-color);
  }

  /* 이벤트 카드 */
  .event-card {
    background: var(--card-bg);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    border: 1px solid rgba(0,0,0,0.04);
    overflow: hidden;
    position: relative;
  }

  .event-card.today-card {
    border: 2.5px solid #e53e3e;
  }

  .event-header {
    display: flex;
    flex-direction: column;
    padding: 12px 70px 12px 15px; 
    cursor: pointer;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
  }

  .card-actions {
    position: absolute;
    top: 10px;
    right: 8px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #cbd5e0;
    width: 28px;
    height: 28px;
    padding: 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  .share-btn:active {
      color: #718096;
  }

  .star-btn.starred {
    color: #d69e2e;
  }

  .event-meta {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 5px; 
    width: 100%;
    margin-bottom: 5px;
    flex-wrap: wrap;
  }

  .event-date {
    font-size: 0.9rem;
    font-weight: 800;
    color: #000000;
  }
  
  .event-divider {
    font-size: 0.85rem;
    color: #cbd5e0;
    font-weight: 700;
  }

  .event-location {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
    text-align: left;
  }

  .event-title {
    font-size: 1rem; 
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.35;
    word-break: keep-all;
    margin-top: 2px;
  }
  
  .event-title.chairman {
    color: var(--primary-color);
    font-weight: 800;
  }

  /* 팝업(모달) 스타일 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
  }

  .modal-content {
    background: #ffffff;
    width: 100%;
    max-width: 400px;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position: relative;
    animation: slideUp 0.3s ease-out;
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    color: #a0aec0;
    z-index: 10;
  }
  
  .day-events-modal-content { max-width: 400px; }
  .day-events-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .day-events-subtitle { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 12px; }
  .day-event-list { display: flex; flex-direction: column; gap: 7px; }
  
  /* 리스트 공통(일정, 자료, 직원) 버튼 아이템 */
  .day-event-item {
    width: 100%; text-align: left; background: #ffffff;
    border: 1px solid #e5e7eb; border-radius: 9px;
    padding: 10px 11px; cursor: pointer;
  }
  .day-event-item:active { background: #f8fafc; }
  .day-event-item-title { font-size: 0.82rem; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .day-event-item-title .chairman-mark {
    font-size: 0.58rem;
    vertical-align: super;
    line-height: 0;
    margin-left: 2px;
    color: #c08a22;
    font-weight: 800;
  }
  .day-event-item-meta { margin-top: 4px; font-size: 0.68rem; color: var(--text-muted); line-height: 1.3; }
  .day-event-item.chairman { border-color: #d0e1fd; background: #f5f9ff; }

  /* 직원 목록용 뱃지 스타일 */
  .staff-badge {
    display: inline-block;
    background: #e2e8f0;
    color: #4a5568;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 6px;
    font-weight: 700;
    vertical-align: middle;
  }
  .staff-badge.executive {
    background: #ebf8ff;
    color: #3182ce;
  }

  .modal-title-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    padding-right: 25px;
  }

  .modal-title {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.35;
    word-break: keep-all;
  }
  .modal-title.chairman {
    color: var(--primary-color);
  }

  .modal-star {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: #cbd5e0;
    margin-left: 10px;
    flex-shrink: 0;
  }
  .modal-star.starred {
    color: #d69e2e;
  }

  .modal-detail-row {
    margin-bottom: 7px;
    display: flex;
    font-size: 0.82rem;
    line-height: 1.45;
  }
  .modal-label {
    font-weight: 700;
    color: var(--text-muted);
    width: 70px;
    flex-shrink: 0;
  }
  .modal-value {
    color: var(--text-dark);
    flex-grow: 1;
    word-break: keep-all;
  }

  /* 버튼 그룹 (상세 모달용) */
  .action-btn-group {

  // CSV 파싱 공통 함수
  function splitCSV(csv) {
    const rows = [];
    let row = [], curr = '';
    let insideQuote = false;
    for (let i = 0; i < csv.length; i++) {
      const char = csv[i];
      const nextChar = csv[i + 1];
      if (char === '"' && insideQuote && nextChar === '"') { curr += '"'; i++; }
      else if (char === '"') { insideQuote = !insideQuote; }
      else if (char === ',' && !insideQuote) { row.push(curr); curr = ''; }
      else if ((char === '\n' || char === '\r') && !insideQuote) {
        if (char === '\r' && nextChar === '\n') i++;
        row.push(curr); rows.push(row); row = []; curr = '';
      } else { curr += char; }
    }
    if (curr || row.length > 0) { row.push(curr); rows.push(row); }
    return rows;
  }

  function parseCSV(csv) {
    const rows = splitCSV(csv);
    const dataArr = [];
    for(let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.length < 3 || !r[0]) continue; 
      
      const dateStr = r[0].trim();
      let m = 1, d = 1;
      const match = dateStr.match(/(\d{1,2})\.(\d{1,2})/);
      let eventDateObj = new Date();
      if (match) {
        m = parseInt(match[1], 10);
        d = parseInt(match[2], 10);
        eventDateObj = new Date(currentYear, m - 1, d);
      }

      let ddayStr = "";
      if(match) {
          const diffTime = eventDateObj.getTime() - todayDateObj.getTime();
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
          if (diffDays === 0) ddayStr = "D-day";
          else if (diffDays > 0) ddayStr = `D-${diffDays}`;
          else ddayStr = `D+${Math.abs(diffDays)}`;
      }

      const id = `${dateStr}_${r[2] ? r[2].trim() : ''}`;
      const timeMatch = dateStr.match(/(?:오전|오후)?\s*(\d{1,2})(?::|시)(\d{2})?/);
      let timeStr = r[7] ? r[7].trim() : '';
      if (!timeStr && timeMatch) {
        let hh = parseInt(timeMatch[1], 10);
        const isPM = /오후/.test(dateStr);
        if (isPM && hh < 12) hh += 12;
        if (/오전/.test(dateStr) && hh === 12) hh = 0;
        timeStr = `${String(hh).padStart(2,'0')}:${timeMatch[2] ? timeMatch[2] : '00'}`;
      }

      dataArr.push({
        id: id,
        month: m,
        day: d,
        date: dateStr,
        location: r[1] ? r[1].trim() : "ㅡ",
        title: r[2] ? r[2].trim() : "ㅡ",
        attendees: r[3] ? r[3].trim() : "ㅡ",
        content: r[4] ? r[4].trim() : "ㅡ",
        host: r[5] ? r[5].trim() : "ㅡ",
        note: r[6] ? r[6].trim() : "ㅡ",
        time: timeStr,
        dday: ddayStr 
      });
    }
    return dataArr;
  }

  function parseStaffCSV(csv) {
    const rows = splitCSV(csv);
    const dataArr = [];
    if (rows.length < 2) return dataArr;

    const headers = rows[0].map(h => h ? h.trim().replace(/\s+/g, '') : "");
    let idx = {
      cat: headers.indexOf("구분"),
      no: headers.indexOf("NO"),
      name: headers.indexOf("성명"),
      affil: headers.indexOf("소속"),
      pos: headers.indexOf("직위"),
      dept: headers.findIndex(h => h.includes("부서")),
      koda: headers.indexOf("KODA"),
      phone: headers.indexOf("연락처"),
      email: headers.indexOf("이메일"),
      note: headers.indexOf("비고")
    };
    if (idx.name === -1) idx = { cat: 0, no: 1, name: 2, affil: 3, pos: 4, dept: -1, koda: 6, phone: 7, email: 8, note: 9 };
    if (idx.koda === -1) idx.koda = 6;

    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.length <= idx.name || !r[idx.name]) continue; 
      dataArr.push({
        category: idx.cat !== -1 && r[idx.cat] ? r[idx.cat].trim() : "분류없음",
        no: idx.no !== -1 && r[idx.no] ? r[idx.no].trim() : "",
        name: idx.name !== -1 && r[idx.name] ? r[idx.name].trim() : "",
        affiliation: idx.affil !== -1 && r[idx.affil] ? r[idx.affil].trim() : "",
        position: idx.pos !== -1 && r[idx.pos] ? r[idx.pos].trim() : "",
        department: idx.dept !== -1 && r[idx.dept] ? r[idx.dept].trim() : "",
        koda: idx.koda !== -1 && r[idx.koda] ? r[idx.koda].trim() : "",
        phone: idx.phone !== -1 && r[idx.phone] ? r[idx.phone].trim() : "",
        email: idx.email !== -1 && r[idx.email] ? r[idx.email].trim() : "",
        note: idx.note !== -1 && r[idx.note] ? r[idx.note].trim() : ""
      });
    }
    return dataArr;
  }

      const shareUrl = window.location.href; 
      if (navigator.share) {
          navigator.share({ title: shareTitle, text: shareText, url: shareUrl })
          .catch((error) => console.log('공유 실패', error));
      } else {
          alert("현재 브라우저에서는 공유 기능이 지원되지 않습니다.\n\n" + shareTitle + "\n" + shareText);
      }
  }

  let currentModalGlobalIndex = null;
  window.toggleBookmarkModal = function() {
    if (currentModalGlobalIndex === null) return;
    const event = scheduleData[currentModalGlobalIndex];
    if (bookmarks.includes(event.id)) bookmarks = bookmarks.filter(item => item !== event.id);
    else bookmarks.push(event.id);
    localStorage.setItem('koda_bookmarks', JSON.stringify(bookmarks));
    
    const modalStar = document.getElementById('modalStarBtn');
    if (bookmarks.includes(event.id)) modalStar.classList.add('starred');
    else modalStar.classList.remove('starred');
    updateView();
  }

  window.toggleBookmarksOnly = function() {
    showBookmarksOnly = !showBookmarksOnly;
    const btn = document.getElementById('bookmarkFilterBtn');
    if (showBookmarksOnly) btn.classList.add('active-bookmark');
    else btn.classList.remove('active-bookmark');
    updateView();
  }

  window.handleSearchInput = function(e) {
    searchQuery = e.target.value.trim().toLowerCase();
    updateView();
  }

  function getFilteredData() {
    let data = scheduleData;
    if (showBookmarksOnly) data = data.filter(event => bookmarks.includes(event.id));
    if (searchQuery !== '') {
      data = data.filter(event => 
        event.title.toLowerCase().includes(searchQuery) ||
        event.location.toLowerCase().includes(searchQuery) ||
        event.date.toLowerCase().includes(searchQuery) ||
        event.content.toLowerCase().includes(searchQuery) ||
        event.host.toLowerCase().includes(searchQuery)
      );
    }
    if (!showBookmarksOnly && searchQuery === '') {
      data = data.filter(event => event.month == calMonth);
    }
    return data;
  }

  async function manualRefresh() {
    document.getElementById('scheduleContainer').innerHTML = `<div class="loading-msg">최신 일정을 새로고침 중입니다...⏳</div>`;
    await loadData();
  }

  async function loadData() {
    try {
      const response = await fetch(GOOGLE_SHEET_CSV_URL + "&t=" + new Date().getTime());
      scheduleData = parseCSV(await response.text());
      updateView();
    } catch (error) {
      document.getElementById('scheduleContainer').innerHTML = `<div class="no-data">일정을 불러오지 못했습니다. 네트워크 상태를 확인해주세요.</div>`;
    }
  }

  let currentBannerIndex = 0;
  let bannerTimer = null;
  let bannerPaused = false;
  let bannerTouchStartX = 0;
  let bannerTouchStartY = 0;

  function getEventDate(event) {
    return new Date(currentYear, Number(event.month) - 1, Number(event.day));
  }

  function getEventTime(event) {
    if (event.time) {
      const t = String(event.time).trim();
      if (/\d{1,2}:\d{2}/.test(t)) return t.replace(/\s*~?\s*$/, '');
    }
    const m = String(event.date || '').match(/(?:오전|오후)?\s*(\d{1,2})(?::|시)(\d{2})?/);
    if (!m) return '';
    let hh = Number(m[1]);
    if (/오후/.test(m[0]) && hh < 12) hh += 12;
    if (/오전/.test(m[0]) && hh === 12) hh = 0;
    return `${String(hh).padStart(2,'0')}:${m[2] || '00'}`;
  }

  function getEventWeekday(event) {
    const names = ['일','월','화','수','목','금','토'];
    return names[getEventDate(event).getDay()];
  }

  function getBannerDDay(event) {
    const eventDate = getEventDate(event);
    const baseDate = new Date(currentYear, currentMonth - 1, currentDay);
    eventDate.setHours(0,0,0,0);
    baseDate.setHours(0,0,0,0);
    const diff = Math.round((eventDate - baseDate) / 86400000);
    return diff <= 0 ? 'D-DAY' : `D-${diff}`;
  }

  function renderBannerEvent(event, badgeText) {
    const globalIndex = scheduleData.indexOf(event);
    const time = getEventTime(event);
    const location = event.location && event.location !== 'ㅡ' ? event.location : '';
    const dateText = `${String(event.month).padStart(2,'0')}.${String(event.day).padStart(2,'0')}(${getEventWeekday(event)})`;
    const metaParts = [dateText, time ? `${time}~` : ''].filter(Boolean);
    const meta = location
      ? `${metaParts.join(' ')}${metaParts.length ? ' / ' : ''}${location}`
      : metaParts.join(' ');
    const ddayText = getBannerDDay(event);

    return `
      <div class="banner-heading">
        <span class="banner-kicker">${ddayText}</span>
        <span class="banner-meta">${meta}</span>
      </div>
      <button type="button" class="banner-event" onclick="openModal(${globalIndex})" aria-label="${event.title}">
        <span class="banner-event-line2">${event.title}</span>
      </button>
    `;
  }

  function renderScheduleBanner() {
    const track = document.getElementById('scheduleBannerTrack');
    const dots = document.getElementById('bannerDots');
    if (!track || !dots) return;

    const todayKey = new Date(currentYear, currentMonth - 1, currentDay);
    todayKey.setHours(0,0,0,0);
    const todayEvents = scheduleData
      .filter(e => getEventDate(e).getTime() === todayKey.getTime())
      .sort((a,b) => (getEventTime(a) || '').localeCompare(getEventTime(b) || ''));
    const upcomingEvents = scheduleData
      .filter(e => getEventDate(e) > todayKey)
      .sort((a,b) => getEventDate(a) - getEventDate(b))
      .slice(0, 3);

    const bannerEvents = [];
    if (todayEvents.length) bannerEvents.push({ event: todayEvents[0], badge: 'D-DAY' });
    upcomingEvents.forEach(event => bannerEvents.push({ event, badge: getBannerDDay(event) }));

    if (!bannerEvents.length) {
      track.innerHTML = `<div class="schedule-banner-slide active"><div class="banner-heading"><span class="banner-kicker">일정 안내</span></div><div class="banner-empty">표시할 일정이 없습니다.</div></div>`;
      dots.innerHTML = '';
      return;
    }

    track.innerHTML = bannerEvents.map((item, i) => `
      <div class="schedule-banner-slide${i === 0 ? ' active' : ''}" data-slide="${i}">
        ${renderBannerEvent(item.event, item.badge)}
      </div>
    `).join('');

    dots.innerHTML = bannerEvents.map((_, i) => `<button type="button" class="banner-dot${i === 0 ? ' active' : ''}" onclick="goBanner(${i})" aria-label="일정 ${i+1}"></button>`).join('');
    currentBannerIndex = 0;
  }

  function goBanner(index) {
    const slides = document.querySelectorAll('.schedule-banner-slide');
    const dots = document.querySelectorAll('.banner-dot');
    if (!slides.length) return;
    currentBannerIndex = (index + slides.length) % slides.length;
    slides.forEach((slide, i) => slide.classList.toggle('active', i === currentBannerIndex));
    dots.forEach((dot, i) => dot.classList.toggle('active', i === currentBannerIndex));
  }

  window.goBanner = goBanner;
  window.changeBanner = function(offset) {
    goBanner(currentBannerIndex + offset);
    startBannerAutoPlay();
  };

  function startBannerAutoPlay() {
    clearInterval(bannerTimer);
    if (bannerPaused) return;
    const slides = document.querySelectorAll('.schedule-banner-slide');
    if (slides.length <= 1) return;
    bannerTimer = setInterval(() => goBanner(currentBannerIndex + 1), 4000);
  }

  window.toggleBannerPause = function() {
    bannerPaused = !bannerPaused;
    const btn = document.getElementById('bannerPauseBtn');
    if (btn) {
      btn.innerText = bannerPaused ? '▶' : 'Ⅱ';
      btn.setAttribute('aria-label', bannerPaused ? '배너 자동 넘김 재생' : '배너 자동 넘김 일시정지');
      btn.classList.toggle('paused', bannerPaused);
    }
    if (bannerPaused) clearInterval(bannerTimer);
    else startBannerAutoPlay();
  };

  function updateScheduleBanner() {
    renderScheduleBanner();
    goBanner(0);
    startBannerAutoPlay();
  }

  function initBannerTouch() {
    const banner = document.getElementById('scheduleBanner');
    if (!banner || banner.dataset.touchReady) return;
    banner.dataset.touchReady = '1';
    banner.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      bannerTouchStartX = e.touches[0].clientX;
      bannerTouchStartY = e.touches[0].clientY;
    }, {passive:true});
    banner.addEventListener('touchend', e => {
      if (e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - bannerTouchStartX;
      const dy = e.changedTouches[0].clientY - bannerTouchStartY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        goBanner(currentBannerIndex + (dx < 0 ? 1 : -1));
        startBannerAutoPlay();
      }
    }, {passive:true});
  }
  initBannerTouch();

  function updateView() {
    updateScheduleBanner();
    renderCalendar();
    renderSchedules();
  }

  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const display = document.getElementById('calMonthDisplay');
    
    grid.style.animation = 'none'; grid.offsetHeight; grid.style.animation = 'fadeIn 0.3s ease-out';
    grid.innerHTML = '';
    display.innerText = `${calYear}년 ${calMonth}월`;

    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    days.forEach((day, index) => {
      let dayClass = "cal-day-name";
      if (index === 0) dayClass += " text-red";
      else if (index === 6) dayClass += " text-blue";
      grid.innerHTML += `<div class="${dayClass}">${day}</div>`;
    });

    const firstDayIndex = new Date(calYear, calMonth - 1, 1).getDay();
    const lastDay = new Date(calYear, calMonth, 0).getDate();

    for(let i = 0; i < firstDayIndex; i++) grid.innerHTML += `<div class="cal-cell empty"></div>`;

    for(let d = 1; d <= lastDay; d++) {
      let monthBaseData = scheduleData.filter(e => e.month === calMonth && e.day === d);
      if (showBookmarksOnly) monthBaseData = monthBaseData.filter(e => bookmarks.includes(e.id));

      let eventsHtml = '';
      monthBaseData.forEach(e => {
        const isChairman = e.note.includes("회장님 참석");
        let chipClass = "cal-event-chip";
        if (isChairman) chipClass += " chairman";
        const shortTitle = e.title.length > 7 ? e.title.substring(0, 7) + '..' : e.title;
        eventsHtml += `<div class="${chipClass}" onclick="openDayEventsModal(${calYear}, ${calMonth}, ${d}); event.stopPropagation();">${shortTitle}</div>`;
      });

      const isToday = (calYear === currentYear && calMonth === currentMonth && d === currentDay);
      const cellClass = isToday ? "cal-cell today" : "cal-cell";
      const todayBadge = isToday ? `<span class="today-badge">TODAY</span>` : "";

      const currentDayOfWeek = new Date(calYear, calMonth - 1, d).getDay();
      const mmdd = String(calMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      let dateNumClass = "cal-date-num";
      
      if (currentDayOfWeek === 0 || holidays2026.includes(mmdd)) dateNumClass += " text-red";
      else if (currentDayOfWeek === 6) dateNumClass += " text-blue";

      const dateClick = monthBaseData.length > 0 ? `onclick="openDayEventsModal(${calYear}, ${calMonth}, ${d})"` : "";

      grid.innerHTML += `
        <div class="${cellClass}" ${dateClick} style="${monthBaseData.length > 0 ? 'cursor:pointer;' : ''}">
          <div class="${dateNumClass}">${d}${todayBadge}</div>
          ${eventsHtml}
        </div>
      `;
    }
  }

  window.changeMonth = function(offset) {
    calMonth += offset;
    if(calMonth > 12) { calMonth = 1; calYear++; }
    else if(calMonth < 1) { calMonth = 12; calYear--; }
    updateView();
  };

  function createEventCard(event) {
    const globalIndex = scheduleData.indexOf(event);
    const isChairman = event.note.includes("회장님 참석");
    const titleClass = isChairman ? "event-title chairman" : "event-title";
    const isStarred = bookmarks.includes(event.id);
    const isToday = event.dday === "D-day";

    const card = document.createElement('div');
    card.className = 'event-card' + (isToday ? ' today-card' : '');
    const todayBadgeHtml = isToday ? `<div class="card-today-badge">TODAY</div>` : '';

    card.innerHTML = `
      ${todayBadgeHtml}
      <div class="card-actions">
        <button class="icon-btn share-btn" onclick="shareEvent(event, ${globalIndex})">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18,16.08c-0.76,0-1.44,0.3-1.96,0.77L8.91,12.7C8.96,12.47,9,12.24,9,12s-0.04-0.47-0.09-0.7l7.05-4.11 c0.54,0.5,1.25,0.81,2.04,0.81c1.66,0,3-1.34,3-3c0-1.66-1.34-3-3-3s-3,1.34-3,3c0,0.24,0.04,0.47,0.09,0.7L8.04,9.81 C7.5,9.31,6.79,9,6,9c-1.66,0-3,1.34-3,3s1.34,3,3,3c0.79,0,1.5-0.31,2.04-0.81l7.12,4.15c-0.05,0.21-0.08,0.43-0.08,0.66 c0,1.61,1.31,2.92,2.92,2.92c1.61,0,2.92-1.31,2.92-2.92C20.92,17.39,19.61,16.08,18,16.08z"></path>
          </svg>
        </button>
        <button class="icon-btn star-btn ${isStarred ? 'starred' : ''}" onclick="toggleBookmark(event, '${event.id}')">
          ${isStarred
            ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>'
          }
        </button>
      </div>
      <button class="event-header" onclick="openModal(${globalIndex})">
        <div class="event-meta">
          <div class="event-date">${event.date}</div>
          <div class="event-divider">/</div>
          <div class="event-location">${event.location}&nbsp;(${event.dday})</div>
        </div>
        <div class="${titleClass}">${event.title}</div>
      </button>
    `;
    return card;
  }

  window.togglePastSchedules = function() {
    const list = document.getElementById('pastScheduleList');
    const btn = document.getElementById('pastScheduleBtn');
    if (list.style.display === 'none') {
      list.style.display = 'flex'; btn.innerText = '지난 일정 닫기';
    } else {
      list.style.display = 'none'; btn.innerText = '지난 일정 보기';
    }
  }

  function renderSchedules() {
    const scheduleContainer = document.getElementById('scheduleContainer');
    scheduleContainer.innerHTML = '';
    const currentFilteredData = getFilteredData();

    if (currentFilteredData.length === 0) {
      scheduleContainer.innerHTML = `<div class="no-data">등록된 일정이 없습니다.</div>`; 
      return;
    }

    const pastEvents = [], todayEvents = [], futureEvents = [];
    currentFilteredData.forEach(event => {
      if (event.dday === "D-day") todayEvents.push(event);
      else if (event.dday.startsWith("D+")) pastEvents.push(event);
      else futureEvents.push(event);
    });

    const isPastMonthView = (!showBookmarksOnly && searchQuery === '' && ((calYear < currentYear) || (calYear === currentYear && calMonth < currentMonth)));
    const listWrapper = document.createElement('div'); 
    listWrapper.className = 'schedule-list-wrapper';

    if (isPastMonthView) {
        pastEvents.forEach(event => listWrapper.appendChild(createEventCard(event)));
    } else {
        todayEvents.forEach(event => listWrapper.appendChild(createEventCard(event)));
        futureEvents.forEach(event => listWrapper.appendChild(createEventCard(event)));
        if (pastEvents.length > 0) {
            if (todayEvents.length > 0 || futureEvents.length > 0) {
                const divider = document.createElement('div');
                divider.style.borderTop = '1.5px dashed #1a202c'; 
                divider.style.margin = '15px 5px'; 
                divider.style.opacity = '0.5'; 
                listWrapper.appendChild(divider);
            }
            pastEvents.forEach(event => listWrapper.appendChild(createEventCard(event)));
        }
        if (todayEvents.length === 0 && futureEvents.length === 0 && pastEvents.length === 0) {
            listWrapper.innerHTML = `<div class="no-data" style="padding: 10px;">예정 일정이 없습니다.</div>`;
        }
    }
    scheduleContainer.appendChild(listWrapper);
  }
  
  if (!history.state || !history.state.kodaBase) { history.replaceState({kodaBase:true}, '', location.href); }
  window.addEventListener('popstate', function(event) {
    const st = event.state || {};
    const ids = ['dayEventsModal', 'staffScreen', 'staffDetailModal', 'newsScreen', 'newsDetailScreen'];
    ids.forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });
    hideModalDOM();
    document.body.style.overflow = 'auto';

    if (st.staffOpen) document.getElementById('staffScreen').style.display='flex';
    else if (st.staffDetailOpen) document.getElementById('staffDetailModal').style.display='flex';
    else if (st.dayEventsModalOpen) document.getElementById('dayEventsModal').style.display='flex';
    else if (st.newsOpen) document.getElementById('newsScreen').style.display = 'flex';
    else if (st.newsDetailOpen) document.getElementById('newsDetailScreen').style.display = 'flex';

    if (st.staffOpen || st.staffDetailOpen || st.dayEventsModalOpen || st.newsOpen || st.newsDetailOpen) {
      document.body.style.overflow='hidden';
    }
  });

  window.openDayEventsModal = function(year, month, day) {
    const dayEvents = scheduleData.filter(eventData => Number(eventData.month) === Number(month) && Number(eventData.day) === Number(day) && (!showBookmarksOnly || bookmarks.includes(eventData.id)));
    if (dayEvents.length === 0) return;

    document.getElementById('dayEventsTitle').innerText = `${year}년 ${month}월 ${day}일 일정`;
    document.getElementById('dayEventsSubtitle').innerText = `총 ${dayEvents.length}개의 일정이 있습니다. 확인할 일정을 선택하세요.`;
    const list = document.getElementById('dayEventList'); list.innerHTML = '';

    dayEvents.forEach(eventData => {
      const index = scheduleData.indexOf(eventData);
      const item = document.createElement('button'); item.type = 'button';
      item.className = 'day-event-item' + (eventData.note.includes("회장님 참석") ? ' chairman' : '');

      const title = document.createElement('div'); title.className = 'day-event-item-title';
      title.appendChild(document.createTextNode(eventData.title));
      if (eventData.note.includes("회장님 참석")) {
        const chairmanMark = document.createElement('sup'); chairmanMark.className = 'chairman-mark'; chairmanMark.innerText = '★'; title.appendChild(chairmanMark);
      }
      const meta = document.createElement('div'); meta.className = 'day-event-item-meta'; meta.innerText = `${eventData.location} · ${eventData.dday}`;

      item.appendChild(title); item.appendChild(meta);
      item.onclick = function() { closeDayEventsModal(false); openModal(index); };
      list.appendChild(item);
    });
    document.getElementById('dayEventsModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    history.pushState({ dayEventsModalOpen: true }, "", "");
  };

  window.closeDayEventsModal = function(goBack=true) { document.getElementById('dayEventsModal').style.display = 'none'; if(goBack) history.back(); };
  window.closeDayEventsModalOnOutsideClick = function(e) { if(e.target.id === 'dayEventsModal') history.back(); };

  window.openModal = function(globalIndex) {
    currentModalGlobalIndex = globalIndex;
    const event = scheduleData[globalIndex];
    
    const titleEl = document.getElementById('modalTitle');
    titleEl.innerText = event.title;
    titleEl.className = event.note.includes("회장님 참석") ? "modal-title chairman" : "modal-title";

    document.getElementById('modalDate').innerText = event.date;
    document.getElementById('modalLocation').innerText = event.location;
    document.getElementById('modalAttendees').innerText = event.attendees;
    document.getElementById('modalContent').innerText = event.content;
    document.getElementById('modalHost').innerText = event.host;
    document.getElementById('modalNote').innerText = event.note;
    document.getElementById('modalMemo').value = memos[event.id] || '';

    const modalStar = document.getElementById('modalStarBtn');
    if (bookmarks.includes(event.id)) { modalStar.innerText = '★'; modalStar.classList.add('starred'); } 
    else { modalStar.innerText = '☆'; modalStar.classList.remove('starred'); }

    document.getElementById('eventModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    history.pushState({ modalOpen: true }, "", "");
  };

  window.saveEventMemo = function() {
    if (currentModalGlobalIndex === null) return;
    const event = scheduleData[currentModalGlobalIndex];
    const memoText = document.getElementById('modalMemo').value.trim();
    if (memoText === '') delete memos[event.id]; else memos[event.id] = memoText; 
    localStorage.setItem('koda_memos', JSON.stringify(memos));
    alert('메모가 기기에 안전하게 저장되었습니다.');
  };

  function hideModalDOM() { document.getElementById('eventModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
  window.closeModalAction = function() { history.back(); };
  window.closeModalOnOutsideClick = function(e) { if(e.target.id === 'eventModal') history.back(); };

  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'inline-block'; 
    installBtn.addEventListener('click', () => {
      installBtn.style.display = 'none'; deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => { deferredPrompt = null; });
    });
  });

  const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);
  if (isIos() && !isInStandaloneMode()) {
    installBtn.style.display = 'inline-block';
    installBtn.addEventListener('click', () => alert("아이폰 화면 맨 아래의 '공유(내보내기) [↑]' 버튼을 누른 후,\n'홈 화면에 추가 [+]'를 선택해주세요!"));
  }

  const calendarWrapper = document.getElementById('calendarWrapper');
  let startX = 0, endX = 0;
  calendarWrapper.addEventListener('touchstart', (e) => { startX = e.changedTouches[0].screenX; }, {passive: true});
  calendarWrapper.addEventListener('touchend', (e) => {
    endX = e.changedTouches[0].screenX;
    if (startX - endX > 50) changeMonth(1);
    else if (endX - startX > 50) changeMonth(-1);
  }, {passive: true});

  initAuth();

</script>
</body>
</html>
